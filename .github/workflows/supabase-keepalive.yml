# Pings the Kingsrun Supabase database once a day so the free project is never paused for inactivity.
# Calls the same read-only function the game uses (kr_version) with a made-up room code, using the public key already in index.html.
# If the call fails, the run fails and GitHub emails you.
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 3 * * *'      # daily, 03:17 UTC
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        run: |
          code=$(curl -sS -m 30 -o /tmp/out -w '%{http_code}' \
            'https://rghnwpogdjcrqpscgiuh.supabase.co/rest/v1/rpc/kr_version?p_code=KEEPALIVE' \
            -H 'apikey: sb_publishable_s1tfxgkggobOgdumNrQUPQ_PCxNli39')
          echo "HTTP $code"; cat /tmp/out; echo
          test "$code" = "200"
