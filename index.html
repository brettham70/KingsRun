/* ---------- Motion edition ----------
   The title carousel, the mouse-driven tilt on the piles and hand, the deal and flip animations and the keyboard
   shortcuts. None of this touches the rules: it only reads the game state and clicks the same buttons a player would. */
const RM=matchMedia('(prefers-reduced-motion: reduce)');
const smooth=t=>t*t*(3-2*t);

// Title screen: six cards on a vertical cylinder. The front card dwells at the centre, then the wheel steps on.
const T={open:false,raf:0,p:0,vel:0,mx:0,my:0,tx:0,ty:0,cw:200,ch:280,els:[],drag:null};
const TITLE_CARDS=[{s:0,r:13},{s:1,r:13},{s:2,r:13},{s:-1,r:0},{s:3,r:13},{s:4,r:13}];
const SLABS=[-1.47,-.73,0,.73,1.47];
function titleBuild(){
  const rig=$('trig');
  rig.innerHTML=TITLE_CARDS.map(c=>`<div class="tcard"><div class="card back" style="transform:translateZ(${SLABS[0]}px) rotateX(180deg)"></div>${
    SLABS.slice(1,4).map(z=>`<i style="transform:translateZ(${z}px)"></i>`).join('')}${
    cardHTML(c,13,'div',`style="transform:translateZ(${SLABS[4]}px)"`)}</div>`).join('');
  T.els=[...rig.children];
}
function titleMetrics(){
  const w=innerWidth,h=innerHeight;
  let cw=Math.min(340,Math.max(170,h*.3))/1.4;
  cw=Math.round(Math.min(cw,w*.42));
  T.cw=cw;T.ch=Math.round(cw*1.4);
  $('trig').style.setProperty('--cw',cw+'px');
}
function titleFrame(){
  T.mx+=(T.tx-T.mx)*.08;T.my+=(T.ty-T.my)*.08;
  const n=T.els.length,h=innerHeight,cardH=T.ch,gap=36,peek=-55,D=1350;
  const round=Math.round(T.p),diff=T.p-round;
  const active=round+Math.sign(diff)*Math.pow(Math.abs(diff)*2,4.2)/2;
  for(let i=0;i<n;i++){
    const el=T.els[i];
    let off=i-active;const half=n/2;
    off=((off+half)%n+n)%n-half;
    const a=Math.abs(off),sign=Math.sign(off);
    if(a>3){el.style.visibility='hidden';continue;}
    el.style.visibility='visible';
    let y,z,rot;
    if(a<=1){
      const e=smooth(a);
      y=e*(cardH+gap);z=400+e*(220-400);rot=e*132;
    }else if(a<=2){
      const e=smooth(a-1),zEnd=-60;
      const yEnd=(h/2-peek)/(D/(D-zEnd))-cardH/2,y0=cardH+gap;
      y=y0+e*(yEnd-y0);z=220+e*(zEnd-220);rot=132+e*(175-132);
    }else{
      const e=smooth(Math.min(a-2,1)),z0=-60,z1=-250;
      const y0=(h/2-peek)/(D/(D-z0))-cardH/2,y1=(h/2+100)/(D/(D-z1))+cardH/2;
      y=y0+e*(y1-y0);z=z0+e*(z1-z0);rot=175+e*(195-175);
    }
    const centre=Math.max(0,1-a);
    const rx=-sign*rot-T.my*12*centre,ry=T.mx*15*centre;
    el.style.zIndex=Math.round(z);
    el.style.transform=`translateY(${(-sign*y).toFixed(2)}px) translateZ(${z.toFixed(2)}px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) rotateZ(-3deg)`;
  }
}
function titleTick(){
  T.raf=0;
  if(!T.open||document.hidden)return;
  T.vel*=.93;T.p+=.0016+T.vel;
  titleFrame();
  T.raf=requestAnimationFrame(titleTick);
}
function titleRun(){
  if(!T.open)return;
  if(RM.matches){titleFrame();return;}
  if(!T.raf)T.raf=requestAnimationFrame(titleTick);
}
function showTitle(on){
  T.open=on;$('title').hidden=!on;
  if(!on){FX.deal=null;return;}
  if(!T.els.length)titleBuild();
  titleMetrics();
  const live=G.round>0&&(G.phase==='draw'||G.phase==='discard'||G.phase==='roundEnd'||G.phase==='court');
  $('tplay').textContent=live?`Continue · round ${G.round}`:'Play';
  titleRun();
}
document.addEventListener('visibilitychange',titleRun);
addEventListener('resize',()=>{if(T.open){titleMetrics();if(RM.matches)titleFrame();}});
$('title').addEventListener('wheel',e=>{T.vel=Math.max(-.03,Math.min(.03,T.vel-e.deltaY*.00004));},{passive:true});
$('title').addEventListener('pointerdown',e=>{if(!e.target.closest('button'))T.drag={y:e.clientY};});
addEventListener('pointerup',()=>{T.drag=null;});
addEventListener('pointercancel',()=>{T.drag=null;});

// One pointer listener feeds both the carousel and the piles on the table. The tilt eases toward the pointer and
// the loop stops as soon as it has caught up, so nothing runs while the mouse is still.
const TILT={x:0,y:0,tx:0,ty:0,raf:0};
function tiltTick(){
  TILT.raf=0;
  TILT.x+=(TILT.tx-TILT.x)*.08;TILT.y+=(TILT.ty-TILT.y)*.08;
  const el=$('piles');
  el.style.setProperty('--mx',TILT.x.toFixed(3));el.style.setProperty('--my',TILT.y.toFixed(3));
  if(Math.abs(TILT.tx-TILT.x)+Math.abs(TILT.ty-TILT.y)>.002)TILT.raf=requestAnimationFrame(tiltTick);
}
function tiltTo(x,y){
  TILT.tx=x;TILT.ty=y;
  if(!TILT.raf&&!RM.matches&&!T.open)TILT.raf=requestAnimationFrame(tiltTick);
}
addEventListener('pointermove',e=>{
  const x=Math.max(-1,Math.min(1,(e.clientX-innerWidth/2)/(innerWidth/2)));
  const y=Math.max(-1,Math.min(1,(e.clientY-innerHeight/2)/(innerHeight/2)));
  if(T.open){
    T.tx=x;T.ty=y;
    if(T.drag){const d=(e.clientY-T.drag.y)/(T.ch*1.7);T.drag.y=e.clientY;T.p+=d;T.vel=d*.35;}
  }else if(e.pointerType==='mouse')tiltTo(x,y);
});
document.addEventListener('mouseleave',()=>{T.tx=0;T.ty=0;tiltTo(0,0);});

// A card in your hand leans toward the mouse while it's under the pointer.
let hov=null;
function unhover(){if(hov){hov.style.removeProperty('--rx');hov.style.removeProperty('--ry');hov=null;}}
$('groups').addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse'||RM.matches)return;
  const c=e.target.closest('button.card');
  if(c!==hov)unhover();
  if(!c||c.tabIndex<0)return;
  hov=c;
  const r=c.getBoundingClientRect();
  const px=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),py=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));
  c.style.setProperty('--ry',((px-.5)*20).toFixed(1)+'deg');
  c.style.setProperty('--rx',((.5-py)*16).toFixed(1)+'deg');
});
$('groups').addEventListener('pointerleave',unhover);

// Deal, draw and discard animations. Each one is keyed to the state that caused it, so re-drawing the screen
// for any other reason doesn't replay it.
const FX={deal:null,fresh:null,top:undefined};
const EASE='cubic-bezier(.2,.8,.2,1)';
function motionFx(v){
  const playing=G.round>0&&(G.phase==='draw'||G.phase==='discard');
  const top=G.discard[G.discard.length-1],tid=top?top.id:null;
  const can=!RM.matches&&!T.open&&typeof Element.prototype.animate==='function';
  const dk=`${G.round}:${v}:${pp()?G.reveal:''}`;
  if(playing&&(!pp()||G.reveal)&&FX.deal!==dk){
    FX.deal=dk;
    if(can)[...$('groups').querySelectorAll('.card')].forEach((el,i)=>el.animate(
      [{opacity:0,transform:'perspective(700px) translateY(-70px) rotateX(75deg) scale(.8)'},{opacity:1,transform:'perspective(700px) translateY(0) rotateX(0deg) scale(1)'}],
      {duration:420,delay:i*28,easing:EASE,fill:'backwards'}));
  }else if(playing&&G.fresh!=null&&FX.fresh!==G.fresh&&can){
    const el=$('groups').querySelector(`[data-id="${G.fresh}"]`);
    if(el)el.animate([{opacity:0,transform:'perspective(700px) translateY(-90px) rotateY(-80deg) scale(1.15)'},{opacity:1,transform:'perspective(700px) translateY(0) rotateY(0deg) scale(1)'}],{duration:380,easing:EASE});
  }
  FX.fresh=G.fresh;
  if(FX.top!==undefined&&FX.top!==tid&&tid!=null&&can&&playing){
    const el=$('pileCard').firstElementChild;
    if(el)el.animate([{opacity:.3,transform:'translateY(46px) rotateX(-70deg) scale(1.1)'},{opacity:1,transform:'none'}],{duration:340,easing:EASE});
  }
  FX.top=tid;
}

// Keyboard: D draws, T takes the discard, arrows pick a card, Enter discards, H hints, M opens the menu.
document.addEventListener('keydown',e=>{
  if(!G||e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=e.target.tagName||'';
  if(tag==='INPUT'||tag==='TEXTAREA')return;
  const k=e.key.toLowerCase(),onBtn=tag==='BUTTON';
  if(T.open){if((k==='enter'||k===' ')&&!onBtn){e.preventDefault();showTitle(false);render();}return;}
  if(k==='escape'){
    if(menuOpen){menuOpen=false;render();}else if(runPanel){runPanel=false;render();}
    return;
  }
  if(!$('overlay').hidden||!$('cover').hidden)return;
  if(k==='m')openMenu();
  else if(k==='d')$('deckBtn').click();
  else if(k==='t'||k==='p')$('pileBtn').click();
  else if(k==='h')$('hintBtn').click();
  else if((k==='enter'||k===' ')&&!onBtn){e.preventDefault();$('discardBtn').click();}
  else if(k==='arrowleft'||k==='arrowright'){
    if(!(canAct()&&G.phase==='discard'))return;
    const ids=[...document.querySelectorAll('#groups button.card')].map(b=>+b.dataset.id);
    if(!ids.length)return;
    const step=k==='arrowright'?1:-1,i=ids.indexOf(sel);
    sel=ids[i<0?(step>0?0:ids.length-1):(i+step+ids.length)%ids.length];
    e.preventDefault();render();
  }
});

G=load();
if(!G||!G.players)newGame({mode:'ai',count:2,names:[]});
if(!G.mode)G.mode='ai';
if(!G.cfg)G.cfg={mode:G.mode,count:G.mode==='pp'?N():N()-1,names:[]};
G.reveal=false;
if(G.phase==='gameEnd')(isRun()?recordRun:recordGame)();
commit();
if(ONLINE){
  // An invite link (…#join-ABCDE) opens the menu ready to join; otherwise pick up an online game left open.
  const m=/^#join-([A-Za-z0-9]{5})$/.exec(location.hash||'');
  if(m){onlineForm.code=m[1].toUpperCase();openMenu();setTimeout(()=>{const f=$(onlineForm.name?'ocode':'oname');if(f)f.focus();},50);}
  else{const s=savedOnline();if(s)resumeOnline(s);}
}
// Open on the title screen, unless an invite link brought the player straight to the join form.
if(!/^#join-/.test(location.hash||''))showTitle(true);
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
</body>
