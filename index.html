<body>
<style>
@font-face{font-family:"Young Serif";font-style:normal;font-weight:400;font-display:swap;src:url(young-serif-400.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:400;font-display:swap;src:url(figtree-400.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:500;font-display:swap;src:url(figtree-500.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:600;font-display:swap;src:url(figtree-600.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:700;font-display:swap;src:url(figtree-700.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url(ibm-plex-mono-500.woff2) format("woff2")}
html{box-sizing:border-box;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
body{margin:0;font-size:14px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,.card,.pile,.brand,.pill,.status,.log{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{touch-action:manipulation}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one-screen card table — opponents on top, piles in the middle, your hand grouped into melds below, action bar last */
:root{
  --bg:#D9DEE0; --bg2:#C9D1D4; --panel:#EEF1F2; --fg:#1C2329; --muted:#56636B; --line:#B5BFC4;
  --accent:#6B2D7F; --accent-fg:#FFFFFF; --tray:#E3E8EA; --good:#23784A; --bad:#B4233A;
  --face:#FBF8F1; --edge:#CFC8B8; --shadow:#1C232955; --wild:#7A3592; --gold:#8A6510; --coin1:#E9C766; --coin2:#B8891C;
  --su0:#A8740F; --su1:#C2283A; --su2:#23784A; --su3:#1F232B; --su4:#2457B8;
  --back1:#5A2569; --back2:#6E3480; --joker1:#4A1E58; --joker2:#7A3592;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161B; --bg2:#1A2128; --panel:#1F262E; --fg:#E8ECEE; --muted:#97A4AC; --line:#33404A;
  --accent:#C08BD6; --accent-fg:#1A0F20; --tray:#182027; --good:#5BC28A; --bad:#F0707F;
  --face:#EFEADF; --edge:#8C8574; --shadow:#000000AA; --gold:#E2C064; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12161B; --bg2:#1A2128; --panel:#1F262E; --fg:#E8ECEE; --muted:#97A4AC; --line:#33404A;
  --accent:#C08BD6; --accent-fg:#1A0F20; --tray:#182027; --good:#5BC28A; --bad:#F0707F;
  --face:#EFEADF; --edge:#8C8574; --shadow:#000000AA; --gold:#E2C064; color-scheme:dark;
}
/* Colour themes: each sets table, accent, wild marker, card backs and Jokers, with its own dark-mode values */
:root[data-palette="felt"]{--bg2:#C3D3C9;--accent:#8A6510;--accent-fg:#FFFFFF;--wild:#7A5A0E;--back1:#174F37;--back2:#1F6446;--joker1:#123D2B;--joker2:#1E6B49}
:root[data-palette="ocean"]{--bg2:#C5D1DF;--accent:#1F57A6;--accent-fg:#FFFFFF;--wild:#1F57A6;--back1:#1A3C6B;--back2:#244F88;--joker1:#152F55;--joker2:#2A5E9E}
:root[data-palette="ember"]{--bg2:#E0CFCA;--accent:#A3302A;--accent-fg:#FFFFFF;--wild:#9A2D27;--back1:#7A221F;--back2:#952D28;--joker1:#5E1917;--joker2:#A3362F}
:root[data-palette="slate"]{--bg2:#CDD2D6;--accent:#2C343C;--accent-fg:#FFFFFF;--wild:#3A434C;--back1:#2A3037;--back2:#3A424B;--joker1:#1F2429;--joker2:#4A545E}
@media (prefers-color-scheme: dark){
  :root[data-palette="felt"]:not([data-theme="light"]){--bg2:#13241C;--accent:#E2C064;--accent-fg:#1E1606;--wild:#7A5A0E;--back1:#174F37;--back2:#1F6446;--joker1:#123D2B;--joker2:#1E6B49}
  :root[data-palette="ocean"]:not([data-theme="light"]){--bg2:#121C29;--accent:#8DB6F0;--accent-fg:#0B1626;--wild:#1F57A6;--back1:#1A3C6B;--back2:#244F88;--joker1:#152F55;--joker2:#2A5E9E}
  :root[data-palette="ember"]:not([data-theme="light"]){--bg2:#261614;--accent:#F0998A;--accent-fg:#2A0D0B;--wild:#9A2D27;--back1:#7A221F;--back2:#952D28;--joker1:#5E1917;--joker2:#A3362F}
  :root[data-palette="slate"]:not([data-theme="light"]){--bg2:#1A1E22;--accent:#DDE3E7;--accent-fg:#14181C;--wild:#4A545E;--back1:#2A3037;--back2:#3A424B;--joker1:#1F2429;--joker2:#4A545E}
}
:root[data-palette="felt"][data-theme="dark"]{--bg2:#13241C;--accent:#E2C064;--accent-fg:#1E1606}
:root[data-palette="ocean"][data-theme="dark"]{--bg2:#121C29;--accent:#8DB6F0;--accent-fg:#0B1626}
:root[data-palette="ember"][data-theme="dark"]{--bg2:#261614;--accent:#F0998A;--accent-fg:#2A0D0B}
:root[data-palette="slate"][data-theme="dark"]{--bg2:#1A1E22;--accent:#DDE3E7;--accent-fg:#14181C}
@media (hover:hover) and (min-width:900px){
:root:root:root:not([data-x]){
  color-scheme:dark;
  --bg:#000000; --bg2:#0B0B0C; --panel:#111113; --fg:#F5F5F7; --muted:#98989F; --line:#2C2C30;
  --accent:#BF5AF2; --accent-fg:#000000; --tray:#18181B; --good:#30D158; --bad:#FF453A;
  --face:#3A3A3F; --edge:#3A3A3F; --shadow:#000000CC; --wild:#C7C7CC; --gold:#FFD60A; --coin1:#FFE27A; --coin2:#C9A227;
  --su0:#FFD60A; --su1:#FF453A; --su2:#30D158; --su3:#E5E5EA; --su4:#4DA3FF;
  --back1:#2A1040; --back2:#3D1A5C; --joker1:#5E5CE6; --joker2:#BF5AF2;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
:root:root[data-palette="felt"]:not([data-x]):not([data-y]){--accent:#30D158;--back1:#0E3323;--back2:#15482F}
:root:root[data-palette="ocean"]:not([data-x]):not([data-y]){--accent:#4DA3FF;--back1:#0F2747;--back2:#17386A}
:root:root[data-palette="ember"]:not([data-x]):not([data-y]){--accent:#FF6B4A;--back1:#4A1210;--back2:#6A1A17}
:root:root[data-palette="slate"]:not([data-x]):not([data-y]){--accent:#F5F5F7;--back1:#1C1C1E;--back2:#2C2C2E}
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}

.top{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.01em;margin-right:auto;white-space:nowrap}
.pill{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:5px 8px;border-radius:999px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.pill.wildp{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 10px;font-weight:600;font-size:13px;cursor:pointer}

.opps{display:grid;gap:6px}
.opp{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 9px;display:flex;flex-direction:column;gap:1px;min-width:0;transition:border-color .2s, box-shadow .2s}
.opp.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opp .nm{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp .meta b{color:var(--fg);font-weight:600}
.badge{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;padding:2px 5px;border-radius:5px;background:var(--accent);color:var(--accent-fg)}
.fan{display:flex;height:22px}
.fan span{width:14px;height:20px;border-radius:3px;margin-right:-8px;background:repeating-linear-gradient(45deg,var(--back1) 0 3px,var(--back2) 3px 6px);border:1px solid var(--face)}

.table{background:var(--bg2);border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:14px}
.piles{display:flex;gap:12px;align-items:flex-end}
.pile{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;cursor:pointer;--cw:clamp(46px,min(9vh,19vw),104px)}
/* Early rounds (small hands) leave room to spare, so the table and its piles get bigger. */
.app.roomy .pile{--cw:clamp(56px,min(15vh,21vw),150px)}
.app.roomy .table{padding:16px;gap:18px}
.app.roomy .info .status{font-size:clamp(15px,2.1vh,19px)}
.app.roomy .info .log{font-size:clamp(13px,1.7vh,15px)}
.info{display:flex;flex-direction:column;gap:4px;min-width:0}
.info .eyebrow{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.info .status,.info .log{text-align:left}
.pile:disabled{cursor:default}
.pile .lbl{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.pile.can .card{box-shadow:0 0 0 3px var(--accent),0 6px 14px -6px var(--shadow)}
@media (prefers-reduced-motion:no-preference){.pile.can .card{animation:breathe 1.6s ease-in-out infinite}}
@keyframes breathe{50%{transform:translateY(-3px)}}
.empty{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:9px;border:2px dashed var(--line)}
.status{font-size:14px;font-weight:600;text-align:center;text-wrap:balance}
.log{font-size:12.5px;color:var(--muted);text-align:center;min-height:1.2em}

.handhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:auto}
.handhead h2{font-family:var(--display);font-size:17px;font-weight:400;margin:0}
.handhead .meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
/* Hand: each group is one unbroken row of cards. When space runs out, cards overlap like a held fan instead of wrapping,
   and the card size is fitted so the whole hand shows without scrolling. */
.handzone{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-top:2px}
.groups{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;--cw:56px;--k:1;--kg:4px}
.groups.packed{--k:.62;--kg:0px}
.grp{background:var(--tray);border:1px solid var(--line);border-radius:12px;padding:4px 6px 6px;display:flex;flex-direction:column;gap:2px;min-width:0;
  /* --nb: cards counted for the packed width (a little overlap); --n: cards in the group (fully spread width) */
  flex:1 1 calc(14px + var(--cw) + (var(--nb) - 1) * (var(--cw) * var(--k) + var(--kg)));
  max-width:min(100%, calc(14px + var(--n) * var(--cw) + (var(--n) - 1) * 4px))}
.grp .gl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp .cs .card{box-shadow:-3px 0 6px -3px var(--shadow),0 2px 6px -2px var(--shadow)}
.grp.dead{border-style:dashed}
.grp .gl{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-left:2px}
.grp.meld .gl{color:var(--good)}
.grp.spare{border:1.5px dashed var(--accent)}
.grp.spare .gl{color:var(--accent);font-weight:600}
.grp .cs{display:grid;grid-auto-flow:column;padding-top:10px;margin-top:-4px}

.card{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.13);background:var(--face);border:1px solid var(--edge);position:relative;display:block;flex:none;padding:0;
  box-shadow:0 2px 6px -2px var(--shadow);font-family:var(--display);color:var(--su3);overflow:hidden;transition:transform .15s}
.card .rk{position:absolute;top:calc(var(--cw)*.06);left:calc(var(--cw)*.09);font-size:calc(var(--cw)*.36);line-height:1;display:flex;flex-direction:column;align-items:center}
.card .rk i{font-style:normal;font-size:calc(var(--cw)*.24);margin-top:2px;font-family:var(--body)}
.card .big{position:absolute;right:calc(var(--cw)*.07);bottom:calc(var(--cw)*.12);font-size:calc(var(--cw)*.56);line-height:1;font-family:var(--body)}
.card .tag{position:absolute;left:0;right:0;bottom:0;font-family:var(--mono);font-size:max(7px,calc(var(--cw)*.15));text-transform:uppercase;letter-spacing:.1em;text-align:center;background:var(--wild);color:#FFFFFF;padding:1px 0}
.card.wild{border:2px solid var(--wild)}
.card.s0{color:var(--su0)} .card.s1{color:var(--su1)} .card.s2{color:var(--su2)} .card.s3{color:var(--su3)} .card.s4{color:var(--su4)}
.card.joker{background:linear-gradient(160deg,var(--joker1),var(--joker2));color:#F6E7FB}
.card.joker .rk{font-size:calc(var(--cw)*.22);letter-spacing:.04em}
.card.joker .big{right:auto;left:50%;transform:translateX(-50%);bottom:calc(var(--cw)*.3)}
.card.joker .tag{background:#F6E7FB;color:var(--joker1)}
.card.back{background:repeating-linear-gradient(45deg,var(--back1) 0 6px,var(--back2) 6px 12px);border:3px solid var(--face)}
.card.back .cnt{position:absolute;inset:auto 0 6px;text-align:center;font-family:var(--mono);font-size:11px;color:#F6E7FB}
button.card{cursor:pointer}
button.card.sel{transform:translateY(-8px);box-shadow:0 0 0 3px var(--accent),0 8px 14px -6px var(--shadow)}
button.card.fresh:not(.sel){box-shadow:0 0 0 2px var(--good),0 2px 6px -2px var(--shadow)}
.mini{--cw:30px}
.mini .card .tag{display:none}

.actions{display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:12px;padding:13px 14px;font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-fg);cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{flex:none;background:var(--panel);color:var(--fg);border:1px solid var(--line);font-weight:600}

.overlay{position:fixed;inset:0;background:#0A0D1199;display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.sheet{background:var(--panel);color:var(--fg);width:100%;max-width:640px;max-height:88%;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet>*{flex-shrink:0}
.sheet h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;text-wrap:balance}
.sheet h3{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:4px 0 0;font-weight:500}
.res{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:12px;background:var(--tray);border:1px solid var(--line)}
.res .row{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
/* Round results scale with the screen: --rcw (card width) is fitted so every hand and the Deal button show without scrolling. */
.sheet.results{max-width:960px;max-height:calc(100% - 6px);--rcw:30px;gap:10px;padding-bottom:0}
.sheet.results h2{font-size:clamp(20px,calc(var(--rcw)*.3 + 12px),32px)}
.sheet.results .res{padding:8px 10px}
.sheetfoot{position:sticky;bottom:0;margin-top:auto;display:grid;grid-template-columns:auto 1fr;gap:8px;background:var(--panel);
  padding:10px 0 calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);z-index:2}
.res .row b{font-size:clamp(15px,calc(var(--rcw)*.28 + 7px),24px)}
.res .row span{font-size:clamp(13px,calc(var(--rcw)*.22 + 6px),19px);color:var(--muted)}
.res .pts{font-weight:700;color:var(--bad)} .res .pts.zero{color:var(--good)}
.res .lay{display:flex;flex-wrap:wrap;gap:8px;--cw:var(--rcw);min-width:0}
.res .lay .g{display:grid;grid-auto-flow:column;padding:3px;border-radius:7px;border:1px solid var(--line);min-width:0;max-width:100%}
.res .lay .card{box-shadow:-2px 0 4px -2px var(--shadow)}
.sheet.results.tiny .res .card .tag{display:none}
.res .lay .g.dead{border-style:dashed;border-color:var(--bad)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.scroll{overflow-x:auto}
table.sc{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
.sc th,.sc td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.sc th:first-child,.sc td:first-child{text-align:left;color:var(--muted)}
.sc tfoot td{font-weight:700;border-bottom:0}
.rules{margin:0;padding-left:18px;font-size:14px;line-height:1.5;display:flex;flex-direction:column;gap:4px;max-width:60ch}
.btn.wide{width:100%}
.sheethead{position:sticky;top:-18px;margin-top:-18px;padding:18px 0 10px;background:var(--panel);z-index:3;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sheethead h2{flex:1;min-width:0}
.navlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.nav{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:10px;text-align:left;padding:13px 14px;background:var(--tray);border:0;border-bottom:1px solid var(--line);cursor:pointer}
.nav:last-child{border-bottom:0}
.nav b{font-size:15px;font-weight:700}
.nav span{grid-row:2;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.nav i{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-size:22px;color:var(--muted)}
.note.err,.log.err{color:var(--bad)}
.lobby{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lobby li{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:var(--tray);border:1px solid var(--line);min-width:0}
.lobby .ln{font-weight:600;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagp{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;padding:2px 5px;border-radius:5px;background:var(--accent);color:var(--accent-fg)}

.keys{display:none}
.nav[data-act="title"]{display:none}

/* Cards: dark metal faces lit in the suit's colour */
.card{background:radial-gradient(130% 85% at 100% 100%,color-mix(in srgb,currentColor 24%,transparent),transparent 62%),linear-gradient(155deg,#26262A 0%,#131315 46%,#09090A 100%);

button.card.fresh:not(.sel){box-shadow:0 0 0 2px var(--good),0 0 22px -4px var(--good)}

/* Hand: cards lift and lean toward the pointer */
#groups button.card{transform:perspective(700px) translateY(var(--lift,0px)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out,box-shadow .18s}

/* Deck and discard: stacked slabs give each pile real thickness; the whole pile leans with the mouse */
.pile{perspective:720px}
.p3d{display:block;position:relative;width:var(--cw);height:calc(var(--cw)*1.4);transform-style:preserve-3d;
  transform:rotateX(calc(var(--my,0)*-13deg)) rotateY(calc(var(--mx,0)*16deg)) rotateZ(-3deg)}

@keyframes floaty{50%{translate:0 -5px}}

/* Title screen: a vertical 3D carousel of the five Kings and a Joker */

.opp.out{border-color:var(--good);box-shadow:0 0 0 1px var(--good),0 0 22px -8px var(--good)}
.opp .badge{background:var(--accent)}.opp.out .badge{background:var(--good);color:#000}
.board{display:none}
@media (hover:hover) and (min-width:900px) and (min-height:620px){
  .app{max-width:1420px;display:grid;grid-template-columns:200px minmax(0,1fr);column-gap:18px;row-gap:12px;
    grid-template-rows:auto auto minmax(clamp(250px,36vh,420px),1fr) minmax(0,auto) auto auto}
  .app>.top,.app>.keys{grid-column:1/-1}
  .app>.top{grid-row:1}

  .app>.actions{grid-column:2;grid-row:5}
  .app>.keys{grid-row:6}
  .bh{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:2px 4px}
  .bp{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 14px 11px;display:flex;flex-direction:column;gap:1px;

  .bp .bn{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:700;font-size:14px}

<script>
/*ENGINE-START*/
const SUITS=['★','♥','♣','♠','♦'].map(s=>s+'︎');
const SUIT_NAMES=['stars','hearts','clubs','spades','diamonds'];
const rankLabel=r=>r<=10?String(r):({11:'J',12:'Q',13:'K'})[r];
// `wr` is either the round's wild rank (a number) or, in a Run, one player's rules object:
// {wr, wild(c)→bool, pts(c)→cost, bookMin(rank)→smallest book}. A plain number always means the standard rules.
// Rules objects add a tiny cost (1/1024) to every leftover card, so a cost of 0 still means every card is grouped
// even when some cards are free; bills round the cost down.
const isWild=(c,wr)=>typeof wr==='object'?wr.wild(c):c.s<0||c.r===wr;
const pts=(c,wr)=>typeof wr==='object'?wr.pts(c):c.s<0?50:c.r===wr?20:c.r;
const short=c=>c.s<0?'a Joker':rankLabel(c.r)+SUITS[c.s];

// Best arrangement of a hand into books/runs, minimising unmatched points.
function solve(hand,wr){
  const BMf=typeof wr==='object'&&wr.bookMin, BM=r=>BMf?BMf(r):3;
  const nat=[],wild=[];
  for(const c of hand)(isWild(c,wr)?wild:nat).push(c);
  nat.sort((a,b)=>a.s-b.s||a.r-b.r);
  wild.sort((a,b)=>pts(b,wr)-pts(a,wr));
  const W=wild.length,n=nat.length;
  const asc=wild.map(c=>pts(c,wr)).sort((a,b)=>a-b);
  const memo=new Map();
  function go(mask,used,has){
    const key=(mask*16+used)*2+has;
    const m0=memo.get(key); if(m0)return m0;
    let i=0; while(i<n&&(mask>>i&1))i++;
    let best;
    if(i===n){
      const left=W-used;let cost=0;
      if(left>0&&!has&&left<3)for(let k=0;k<left;k++)cost+=asc[k];
      best={cost,step:null};
    }else{
      const c=nat[i],bi=1<<i;
      const nm0=mask|bi;
      best={cost:go(nm0,used,has).cost+pts(c,wr),step:{t:'dead',i},next:[nm0,used,has]};
      if(c.s<0){memo.set(key,best);return best;}  // a Joker that isn't wild can't join a group
      const same=[];
      for(let j=i+1;j<n;j++)if(!(mask>>j&1)&&nat[j].r===c.r)same.push(j);
      for(let m=0;m<(1<<same.length);m++){
        let nm=nm0,cnt=1;const idx=[i];
        for(let k=0;k<same.length;k++)if(m>>k&1){nm|=1<<same[k];cnt++;idx.push(same[k]);}
        const need=Math.max(0,BM(c.r)-cnt);
        if(used+need>W)continue;
        const r=go(nm,used+need,1);
        if(r.cost<best.cost)best={cost:r.cost,step:{t:'book',idx,need},next:[nm,used+need,1]};
        if(best.cost===0)break;
      }
      for(let a=3;a<=c.r&&best.cost>0;a++){
        for(let b=Math.max(c.r,a+2);b<=13;b++){
          let nm=nm0,need=0,ok=true;const slots=[];
          for(let p=a;p<=b;p++){
            if(p===c.r){slots.push(i);continue;}
            let f=-1;
            for(let j=i+1;j<n;j++)if(!(nm>>j&1)&&nat[j].s===c.s&&nat[j].r===p){f=j;break;}
            if(f>=0){nm|=1<<f;slots.push(f);}else{need++;slots.push(-1);}
            if(used+need>W){ok=false;break;}
          }
          if(!ok){if(b>c.r)break;else continue;}
          const r=go(nm,used+need,1);
          if(r.cost<best.cost)best={cost:r.cost,step:{t:'run',slots},next:[nm,used+need,1]};
        }
      }
    }
    memo.set(key,best);return best;
  }
  const root=go(0,0,0);
  const melds=[],dead=[];
  let node=root;
  while(node.step){
    const s=node.step;
    if(s.t==='dead')dead.push(nat[s.i]);
    else if(s.t==='book')melds.push({type:'book',slots:[...s.idx.map(j=>nat[j]),...Array(s.need).fill(null)]});
    else melds.push({type:'run',slots:s.slots.map(j=>j<0?null:nat[j])});
    node=go(...node.next);
  }
  let wi=0;
  for(const m of melds){m.cards=m.slots.map(x=>x||wild[wi++]);delete m.slots;}
  const left=wild.slice(wi);
  if(left.length){
    if(melds.length)melds[0].cards.push(...left);
    else if(left.length>=3)melds.push({type:'book',cards:left});
    else dead.push(...left);
  }
  dead.sort((a,b)=>a.s-b.s||a.r-b.r);
  return {cost:root.cost,melds,dead};
}

function bestDiscard(hand,wr){
  let best=null;
  for(const c of hand){
    const rest=hand.filter(x=>x!==c);
    const cost=solve(rest,wr).cost;
    const score=cost+(isWild(c,wr)?1000:0)-pts(c,wr)*0.01;
    if(!best||score<best.score)best={card:c,cost,score};
  }
  return best;
}

// Randomness. Normally every draw comes from the browser's cryptographic RNG (fair and unpredictable).
// seedRng(n) switches to a repeatable generator, so a whole game can be replayed from one number (tests, simulations,
// and later daily runs). clearRng() goes back to the secure one. Nothing in the app seeds it during normal play.
let RNG_FN=null;
function seedRng(seed){let a=(seed>>>0)||1;RNG_FN=()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return (t^(t>>>14))>>>0;};}
function clearRng(){RNG_FN=null;}
function randU32(){
  if(RNG_FN)return RNG_FN();
  const c=globalThis.crypto;
  if(!c||!c.getRandomValues)return Math.floor(Math.random()*0x100000000);
  const buf=new Uint32Array(1);c.getRandomValues(buf);return buf[0];
}
// Uniform integer in [0,n), with rejection sampling so no value is favoured.
function randInt(n){
  const limit=Math.floor(0x100000000/n)*n;let v;
  do{v=randU32();}while(v>=limit);
  return v%n;
}
const randFloat=()=>randInt(1048576)/1048576;
// Fisher–Yates: every ordering of the deck is equally likely.
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=randInt(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeDeck(){
  const d=[];let id=0;
  for(let k=0;k<2;k++){
    for(let s=0;s<5;s++)for(let r=3;r<=13;r++)d.push({id:id++,s,r});
    for(let j=0;j<3;j++)d.push({id:id++,s:-1,r:0});
  }
  return shuffle(d);
}
/*ENGINE-END*/

const KEY='kingsrun-v1';
const NAMES=['Mara','Theo','Ines'];
const PALETTES=[
  {key:'plum',name:'Plum',a:'#2A1040',b:'#3D1A5C'},
  {key:'felt',name:'Felt',a:'#0E3323',b:'#15482F'},
  {key:'ocean',name:'Ocean',a:'#0F2747',b:'#17386A'},
  {key:'ember',name:'Ember',a:'#4A1210',b:'#6A1A17'},
  {key:'slate',name:'Slate',a:'#1C1C1E',b:'#2C2C2E'}];
const PAL_KEY='kingsrun-palette';
let palette='plum';
function setPalette(k){
  if(!PALETTES.some(p=>p.key===k))k='plum';
  palette=k;document.documentElement.setAttribute('data-palette',k);
  try{localStorage.setItem(PAL_KEY,k)}catch(e){}
}
try{setPalette(localStorage.getItem(PAL_KEY)||'plum')}catch(e){setPalette('plum')}
const NAMES_KEY='kingsrun-names';
// Computer level: how often each computer player makes its best play (Hard always does, as the game always used to).
const LEVELS={easy:{name:'Easy',skill:.55,note:'Makes plenty of mistakes.'},normal:{name:'Normal',skill:.8,note:'Usually plays well, sometimes slips.'},hard:{name:'Hard',skill:1,note:'Always makes its best play.'}};
const LEVEL_KEY='kingsrun-level';
function levelPref(){try{const l=localStorage.getItem(LEVEL_KEY);if(LEVELS[l])return l}catch(e){}return 'normal'}
let G=null, sel=null, menuOpen=false, timer=null, pending=null, menuView='main', autoKey=null, confirmReset=false, confirmClear=false, restoreOpen=false, backupCode=null, recMsg='';

const $=id=>document.getElementById(id);
const wildRank=()=>G.mode==='run'&&G.run&&G.run.jw?G.run.jw:G.round+2;
const N=()=>G.players.length;
const cur=()=>G.players[G.turn];
const pp=()=>G.mode==='pp';
const onl=()=>G&&G.mode==='online';
const viewer=()=>onl()?G.me:pp()?G.turn:0;
const canAct=()=>onl()
  ?G.turn===G.me&&(G.phase==='draw'||G.phase==='discard')&&!(O&&O.busy)
  :G.turn===viewer()&&!cur().ai&&(!pp()||G.reveal);
const isMe=i=>onl()?i===G.me:(G.mode==='ai'||G.mode==='run')&&i===0;
const isRun=()=>G&&G.mode==='run';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const cleanName=s=>String(s||'').replace(/[<>&"]/g,'').trim().slice(0,14);
function loadNames(){try{return JSON.parse(localStorage.getItem(NAMES_KEY))||[]}catch(e){return[]}}
function saveNames(n){try{localStorage.setItem(NAMES_KEY,JSON.stringify(n))}catch(e){}}

/*SAVE-START*/
// Saved games carry a version number. Version 1 (before this) stored the bare game; version 2 adds the computer level.
// Anything from a newer app, or that fails the checks below, is never loaded: it's kept aside and a fresh game starts.
const SAVE_VERSION=2, DECK_SIZE=116;
const PHASES=['lobby','draw','discard','roundEnd','gameEnd','court'];
const goodCard=c=>c&&Number.isInteger(c.id)&&Number.isInteger(c.s)&&c.s>=-1&&c.s<=4&&Number.isFinite(c.r);
// Whether a game is internally consistent: the right players, a legal turn, and all 116 cards accounted for once.
function validGame(g){
  if(!g||typeof g!=='object'||!['ai','pp','run'].includes(g.mode))return false;
  if(!Array.isArray(g.players)||g.players.length<2||g.players.length>4)return false;
  if(!Number.isInteger(g.round)||g.round<1||g.round>11||!PHASES.includes(g.phase))return false;
  if(!Number.isInteger(g.turn)||g.turn<0||g.turn>=g.players.length)return false;
  if(!Array.isArray(g.deck)||!Array.isArray(g.discard))return false;
  const ids=new Set();let n=0;
  const add=cs=>{for(const c of cs){if(!goodCard(c)||ids.has(c.id))return false;ids.add(c.id);n++;}return true;};
  if(!add(g.deck)||!add(g.discard))return false;
  for(const p of g.players){
    if(!p||typeof p.name!=='string'||!Array.isArray(p.hand)||!Array.isArray(p.rounds)||!Number.isFinite(p.score))return false;
    if(!add(p.hand))return false;
  }
  if(n!==DECK_SIZE)return false;
  if(g.mode==='run'){
    const r=g.run;
    if(!r||typeof r!=='object'||!Number.isFinite(r.gold)||!Array.isArray(r.regalia)||!Array.isArray(r.decrees)||!Array.isArray(r.shop))return false;
  }
  return true;
}
// Turn whatever was stored, from any past version, into a game this version can play; null if it can't be trusted.
function migrateSave(raw){
  if(!raw||typeof raw!=='object')return null;
  let v,g;
  if(raw.v===undefined){v=1;g=raw;}else{v=raw.v;g=raw.g;if(!Number.isInteger(v)||v<1||v>SAVE_VERSION)return null;}
  if(!g||typeof g!=='object'||!Array.isArray(g.players))return null;
  g=JSON.parse(JSON.stringify(g));
  if(!g.mode)g.mode='ai';
  if(!g.cfg)g.cfg={mode:g.mode,count:g.mode==='pp'?g.players.length:g.players.length-1,names:[]};
  if(v<2&&g.mode==='ai'&&g.cfg.level===undefined)g.cfg.level='hard';   // games begun before levels existed played at full strength
  return validGame(g)?g:null;
}
function save(){if(onl())return;try{localStorage.setItem(KEY,JSON.stringify({v:SAVE_VERSION,g:G}))}catch(e){}}
let lostSave=false;
function load(){
  let s=null;try{s=localStorage.getItem(KEY)}catch(e){return null}
  if(!s)return null;
  let g=null;try{g=migrateSave(JSON.parse(s))}catch(e){}
  if(!g){lostSave=true;try{localStorage.setItem(KEY+'-unreadable',s)}catch(e){}}
  return g;
}
/*SAVE-END*/

function newGame(cfg){
  const list=cfg.mode==='pp'
    ?Array.from({length:cfg.count},(_,i)=>({name:cleanName(cfg.names[i])||`Player ${i+1}`,ai:false}))
    :cfg.mode==='run'?[{name:'You',ai:false},...NAMES.slice(0,2).map(n=>({name:n,base:n,ai:true}))]
    :[{name:'You',ai:false},...NAMES.slice(0,cfg.count).map(n=>({name:n,ai:true,skill:LEVELS[LEVELS[cfg.level]?cfg.level:'normal'].skill}))];
  G={mode:cfg.mode,cfg:{mode:cfg.mode,count:cfg.mode==='run'?2:cfg.count,names:[...(cfg.names||[])]},
     players:list.map(p=>({...p,hand:[],score:0,rounds:[]})),reveal:false,
     round:0,dealer:0,deck:[],discard:[],turn:0,phase:'draw',outBy:null,finalLeft:0,log:'',fresh:null,result:null};
  if(cfg.mode==='ai')G.cfg.level=LEVELS[cfg.level]?cfg.level:'normal';
  if(cfg.mode==='run')G.run=newRun();
  G.dealer=(N()-2+N())%N();
  sel=null;menuOpen=false;
  startRound();
}
function startRound(){
  G.round++;G.dealer=(G.dealer+1)%N();
  G.deck=makeDeck();
  for(const p of G.players)p.hand=G.deck.splice(0,G.round+2);
  G.discard=[G.deck.pop()];
  G.outBy=null;G.finalLeft=0;G.turn=(G.dealer+1)%N();G.phase='draw';G.fresh=null;G.result=null;G.reveal=false;
  G.log=`Round ${G.round}: ${G.round+2} cards each. ${rankLabel(G.round+2)}s are wild.`;
  sel=null;
  if(isRun())runStartRound();
}
function drawDeck(){
  if(!G.deck.length){const top=G.discard.pop();G.deck=shuffle(G.discard);G.discard=[top];}
  return G.deck.pop();
}
function endTurn(){
  const p=cur(),wr=rulesFor(G.turn);
  if(G.outBy===null){
    if(solve(p.hand,wr).cost===0){G.outBy=G.turn;G.finalLeft=N()-1;G.log+=` and went out!`;}
  }else G.finalLeft--;
  if(isRun())runEndTurn();
  if(G.outBy!==null&&G.finalLeft<=0){endRound();return;}
  G.turn=(G.turn+1)%N();G.phase='draw';G.fresh=null;G.reveal=false;
  if(isRun())runNextTurn();
}
function endRound(){
  G.result=G.players.map((p,i)=>{const s=solve(p.hand,rulesFor(i));const v=i===G.outBy?0:Math.floor(s.cost);p.score+=v;p.rounds.push(v);return{melds:s.melds,dead:s.dead,pts:v};});
  G.phase=G.round>=11?'gameEnd':'roundEnd';
  if(isRun()){runEndRound();return;}
  if(G.phase==='gameEnd')recordGame();
}

const REC_KEY='kingsrun-records';
function loadRec(){try{const r=JSON.parse(localStorage.getItem(REC_KEY));if(r&&r.players)return r}catch(e){}return{players:{},games:[]}}
function saveRec(r){try{localStorage.setItem(REC_KEY,JSON.stringify(r))}catch(e){}}
const recKey=p=>(p.ai?'cpu:':'')+p.name.toLowerCase();
function recordGame(){
  if(G.recorded)return;G.recorded=true;
  const r=loadRec(),min=Math.min(...G.players.map(p=>p.score));
  const winners=G.players.filter(p=>p.score===min);
  for(const p of G.players){
    const k=recKey(p);
    const e=r.players[k]||(r.players[k]={name:p.name,ai:p.ai,played:0,wins:0,ties:0,best:null,total:0});
    e.name=p.name;e.played++;e.total+=p.score;
    if(e.best===null||p.score<e.best)e.best=p.score;
    if(p.score===min){if(winners.length>1)e.ties++;else e.wins++;}
  }
  const game={date:Date.now(),mode:G.mode,level:G.cfg.level,results:G.players.map(p=>({name:p.name,score:p.score})),winners:winners.map(p=>p.name)};
  r.marks=marks(r);
  applyMarks(r.marks,game);
  r.games.unshift(game);
  r.games=r.games.slice(0,20);
  saveRec(r);
}
// Lowest winning score (outright wins only) and highest score by a losing player, across all games.
function applyMarks(m,g){
  const min=Math.min(...g.results.map(p=>p.score));
  if(g.winners.length===1){const s=min;if(!m.lowWin||s<m.lowWin.score)m.lowWin={name:g.winners[0],score:s,date:g.date};}
  for(const p of g.results)if(p.score>min&&(!m.highLoss||p.score>m.highLoss.score))m.highLoss={name:p.name,score:p.score,date:g.date};
}
function marks(r){
  if(r.marks)return r.marks;
  const m={lowWin:null,highLoss:null};
  for(const g of r.games)applyMarks(m,g);
  return m;
}
function marksHTML(){
  const r=loadRec(),m=marks(r);
  if(!m.lowWin&&!m.highLoss)return '';
  const d=t=>new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
  const tile=(lbl,x)=>`<div class="mark"><span class="ml">${lbl}</span>${x?`<b>${x.score}</b><span class="mw">${x.name} · ${d(x.date)}</span>`:'<span class="mw">Not set yet</span>'}</div>`;
  return `<div class="marks">${tile('Lowest winning score',m.lowWin)}${tile('Highest losing score',m.highLoss)}</div>`;
}
function recordsTable(onlyKeys){
  const r=loadRec();
  let rows=Object.entries(r.players);
  if(onlyKeys)rows=rows.filter(([k])=>onlyKeys.includes(k));
  if(!rows.length)return '<p class="note">No finished games yet. Records appear here after round 11.</p>';
  rows.sort((a,b)=>b[1].wins-a[1].wins||(b[1].wins/b[1].played)-(a[1].wins/a[1].played)||a[1].name.localeCompare(b[1].name));
  return `<div class="scroll"><table class="sc rec"><thead><tr><th>Player</th><th>Played</th><th>Won</th><th>Lost</th><th>Tied</th><th>Win %</th><th>Best</th><th>Avg</th></tr></thead><tbody>${
    rows.map(([,e])=>{const l=e.played-e.wins-e.ties;return `<tr><td>${e.name}${e.ai?' <span class="cpu">CPU</span>':''}</td><td>${e.played}</td><td>${e.wins}</td><td>${l}</td><td>${e.ties}</td><td>${Math.round(100*e.wins/e.played)}%</td><td>${e.best}</td><td>${Math.round(e.total/e.played)}</td></tr>`;}).join('')
  }</tbody></table></div>`;
}
function recentGames(){
  const g=loadRec().games.slice(0,8);
  if(!g.length)return '';
  return `<ul class="recent">${g.map(x=>{
    const d=new Date(x.date).toLocaleDateString(undefined,{day:'numeric',month:'short'});
    const res=[...x.results].sort((a,b)=>a.score-b.score).map(p=>`${p.name} ${p.score}`).join(' · ');
    const w=x.winners.length>1?`Tie: ${x.winners.join(' & ')}`:`${x.winners[0]} won`;
    return `<li><span class="rd">${d} · ${x.mode==='pp'?'Pass &amp; play':x.mode==='online'?'Online':'Vs computer'+(x.level&&LEVELS[x.level]?' · '+LEVELS[x.level].name:'')}</span><b>${w}</b><span class="rs">${res}</span></li>`;}).join('')}</ul>`;
}

/* ---------- The Run ----------
   A solo roguelike over the usual 11 rounds. Gold is both health and money: every point you're caught with costs
   1 gold, going out and beating bosses earns gold, and the Court sells Regalia (permanent perks) and Decrees (one-use).
   Numbers were tuned by simulating thousands of rounds (see KINGSRUN-RUN-DESIGN.md). */
const ECON={start:25,act1Cap:10,tribute:3,out:10,low:4,boss:12,reroll:2,maxR:5,maxD:3,vault:25};
const TIERS=r=>r<=3?{title:'Squire',skill:.55}:r<=7?{title:'Knight',skill:.8}:{title:'Baron',skill:.95};
const BOSSES={
  4:{key:'miser',name:'The Miser',short:'No one takes discards',rule:'Nobody may take from the discard pile this round.'},
  8:{key:'jester',name:'The Jester',short:'Wild changes every turn',rule:'The wild rank changes after every turn.'},
  11:{key:'usurper',name:'The Usurper',short:'Your Jokers aren’t wild',rule:'Jokers aren’t wild for you. They’re dead cards worth 50.'}};
for(const k in BOSSES)BOSSES[BOSSES[k].key]=BOSSES[k];
const REGALIA=[
  {id:'commoner',name:"Commoner's Crown",short:'3s wild',text:'3s are wild for you.',price:22},
  {id:'seventh',name:'Seventh Heaven',short:'7s wild',text:'7s are wild for you.',price:24},
  {id:'jewels',name:'Crown Jewels',short:'Ks wild',text:'Kings are wild for you.',price:24},
  {id:'fool',name:'Court Fool',short:'+Joker',text:'You’re dealt an extra Joker every round (except against the Usurper).',price:15},
  {id:'twin',name:'Twin Crowns',short:'Royal pairs',text:'Pairs of J, Q or K count as books for you.',price:16},
  {id:'starlight',name:'Starlight',short:'★ free',text:'★ cards left in your hand cost nothing.',price:13},
  {id:'lowtide',name:'Low Tide',short:'3–5 free',text:'3s, 4s and 5s left in your hand cost nothing.',price:13},
  {id:'purse',name:'Heavy Purse',short:'Faces 5',text:'J, Q and K left in your hand cost 5 each.',price:9},
  {id:'vault',name:"Miser's Vault",short:'Cap 25',text:'A round never costs you more than 25 gold.',price:12},
  {id:'spyglass',name:'Spyglass',short:'See deck',text:'You can always see the top card of the deck.',price:10},
  {id:'eaves',name:'Eavesdropper',short:'Read foes',text:'See how many unmatched points each opponent holds.',price:5},
  {id:'herald',name:'Herald',short:'+5 out',text:'+5 more gold whenever you go out first.',price:9},
  {id:'earlybird',name:'Early Bird',short:'Quick out',text:'Go out within your first 3 turns and your going-out gold doubles.',price:6},
  {id:'mint',name:'Royal Mint',short:'♦ gold',text:'+1 gold for every ♦ in your groups at round end.',price:6},
  {id:'tax',name:'Tax Collector',short:'Tax',text:'+1 gold for every 10 points your opponents are caught with.',price:9},
  {id:'interest',name:'Interest',short:'Interest',text:'+1 gold for every 10 in your Treasury at round end (up to +5).',price:10},
  {id:'patron',name:'Patron',short:'+3/round',text:'+3 gold every round.',price:10},
  {id:'secondwind',name:'Second Wind',short:'2nd wind',text:'Once per run, survive bankruptcy with 10 gold. Then it’s used up.',price:9},
  {id:'gambler',name:"Gambler's Hand",short:'Gamble',text:'Going-out gold ×3, but what you’re caught with costs 1.5×.',price:4}];
const DECREES=[
  {id:'pickpocket',name:'Pickpocket',text:'Before you draw: take the second card down in the discard pile.',price:4},
  {id:'scout',name:'Scout',text:'Before you draw: see the top card of the deck.',price:3},
  {id:'redeal',name:'Redeal',text:'Before you draw: shuffle your hand into the deck and draw a fresh one.',price:5},
  {id:'fog',name:'Fog',text:'On your turn: the next player can’t take from the discard pile.',price:3},
  {id:'pardon',name:'Royal Pardon',text:'This round, your highest-scoring leftover card is free.',price:4},
  {id:'insurance',name:'Insurance',text:'This round’s bill is halved.',price:5}];
const REG=id=>REGALIA.find(x=>x.id===id), DEC=id=>DECREES.find(x=>x.id===id);
const EPS=1/1024;
let runPanel=false, runMsg='';

function newRun(){return {gold:ECON.start,regalia:[],decrees:[],shop:[],rerollCost:ECON.reroll,free:false,
  boss:null,jw:null,callout:'',peek:false,fog:null,pardon:false,insurance:false,turns:0,ledger:null,over:null,bossesBeaten:0};}
const runHas=k=>isRun()&&G.run.regalia.includes(k);

// Rules for one seat. Outside a Run this is just the wild rank, so every other mode plays exactly as before.
function rulesFor(i){
  if(!isRun())return wildRank();
  const wr=wildRank(),me=i===0,has=k=>me&&G.run.regalia.includes(k);
  const extra=[];if(has('commoner'))extra.push(3);if(has('seventh'))extra.push(7);if(has('jewels'))extra.push(13);
  const noJ=me&&G.run.boss==='usurper';
  const wild=c=>c.s<0?!noJ:(c.r===wr||extra.includes(c.r));
  return {wr,wild,bookMin:has('twin')?(r=>r>=11?2:3):null,pts:c=>{
    if(wild(c))return EPS+(c.s<0?50:20);
    if(c.s<0)return EPS+50;
    let v=c.r;
    if(has('lowtide')&&c.r<=5)v=0;
    if(has('purse')&&c.r>=11)v=5;
    if(has('starlight')&&c.s===0)v=0;
    return v+EPS;}};
}
function canTakePile(i){
  if(!isRun())return true;
  return G.run.boss!=='miser'&&G.run.fog!==i;
}
function runStartRound(){
  const r=G.run,boss=BOSSES[G.round],tier=TIERS(G.round);
  r.boss=boss?boss.key:null;r.jw=null;r.callout='';r.peek=false;r.fog=null;r.pardon=false;r.insurance=false;r.turns=0;r.ledger=null;
  G.players.forEach((p,i)=>{if(!i)return;
    if(boss&&i===1){p.name=boss.name;p.boss=boss.key;p.skill=1;p.title='Boss';}
    else{p.name=`${tier.title} ${p.base}`;p.boss=null;p.skill=tier.skill;p.title=tier.title;}});
  if(runHas('fool')&&r.boss!=='usurper'){const j=G.deck.findIndex(c=>c.s<0);if(j>=0)G.players[0].hand.push(G.deck.splice(j,1)[0]);}
  if(boss)G.log=`Round ${G.round}: ${boss.name} joins the table. ${boss.rule}`;
}
function runEndTurn(){if(G.turn===0)G.run.turns++;if(G.run.fog===G.turn)G.run.fog=null;}
function runNextTurn(){
  const r=G.run;r.callout='';
  if(r.boss==='jester'){let k;do{k=3+randInt(11);}while(k===wildRank());r.jw=k;r.callout=`The Jester calls ${rankLabel(k)}s wild.`;}
}
// Settle the round: pay the bill, then collect income. Every line goes into the ledger shown on the results screen.
function runEndRound(){
  runPanel=false;
  const r=G.run,res=G.result[0],L=[],before=r.gold,out=G.outBy===0;
  let bill=res.pts;
  if(!out){
    L.push({t:`Caught with ${bill} point${bill===1?'':'s'}`,v:-bill});
    if(r.pardon&&res.dead.length){const R=rulesFor(0),top=Math.max(...res.dead.map(c=>Math.floor(R.pts(c))));if(top>0){bill-=top;L.push({t:'Royal Pardon',v:top});}}
    if(runHas('gambler')&&bill>0){const nb=Math.ceil(bill*1.5);L.push({t:"Gambler's Hand ×1.5",v:bill-nb});bill=nb;}
    if(r.insurance&&bill>0){const nb=Math.ceil(bill/2);L.push({t:'Insurance halves it',v:bill-nb});bill=nb;}
    if(G.round<=3&&bill>ECON.act1Cap){L.push({t:`Act 1: bills capped at ${ECON.act1Cap}`,v:bill-ECON.act1Cap});bill=ECON.act1Cap;}
    if(runHas('vault')&&bill>ECON.vault){L.push({t:"Miser's Vault",v:bill-ECON.vault});bill=ECON.vault;}
  }
  r.gold-=bill;
  if(r.gold<0&&runHas('secondwind')){r.regalia=r.regalia.filter(x=>x!=='secondwind');L.push({t:'Second Wind saves you',v:10-r.gold});r.gold=10;}
  if(r.gold<0){r.ledger={lines:L,before,after:r.gold};r.over='bust';G.phase='gameEnd';recordRun();return;}
  const pts=G.result.map(x=>x.pts),add=(t,v)=>{if(v){L.push({t,v});r.gold+=v;}};
  add('Royal tribute',ECON.tribute);
  if(out){let g=ECON.out+(runHas('herald')?5:0);
    if(runHas('earlybird')&&r.turns<=3)g*=2;
    if(runHas('gambler'))g*=3;
    add('You went out first',g);}
  if(pts[0]<=Math.min(...pts.slice(1)))add('Lowest score at the table',ECON.low);
  if(r.boss&&pts[0]<pts[1]){add(`Beat ${BOSSES[r.boss].name}`,ECON.boss);r.free=true;r.bossesBeaten++;}
  if(runHas('mint'))add('Royal Mint',res.melds.flatMap(m=>m.cards).filter(c=>c.s===4).length);
  if(runHas('tax'))add('Tax Collector',Math.floor((pts[1]+pts[2])/10));
  if(runHas('patron'))add('Patron',3);
  if(runHas('interest'))add('Interest',Math.min(5,Math.floor(r.gold/10)));
  r.ledger={lines:L,before,after:r.gold};
  if(G.phase==='gameEnd'){r.over='won';recordRun();}
}
function openCourt(){const r=G.run;r.rerollCost=ECON.reroll;rollCourt();G.phase='court';}
function rollCourt(){
  const r=G.run,pick=(a,n)=>shuffle([...a]).slice(0,n);
  r.shop=[...pick(REGALIA.filter(x=>!r.regalia.includes(x.id)),2).map(x=>({kind:'R',id:x.id})),...pick(DECREES,1).map(x=>({kind:'D',id:x.id}))];
}
const offerPrice=o=>G.run.free?0:(o.kind==='R'?REG(o.id):DEC(o.id)).price;
function buyOffer(k){
  const r=G.run,o=r.shop[k];if(!o||o.sold)return;
  const price=offerPrice(o),full=o.kind==='R'?r.regalia.length>=ECON.maxR:r.decrees.length>=ECON.maxD;
  if(price>r.gold||full)return;
  r.gold-=price;o.sold=true;r.free=false;
  (o.kind==='R'?r.regalia:r.decrees).push(o.id);
  runMsg=`${(o.kind==='R'?REG(o.id):DEC(o.id)).name} is yours.`;
}
function sellRegalia(id){
  const r=G.run;if(!r.regalia.includes(id))return;
  const g=Math.floor(REG(id).price/2);r.regalia=r.regalia.filter(x=>x!==id);r.gold+=g;runMsg=`Sold ${REG(id).name} for ${g} gold.`;
}
// Whether a Decree can be played right now, and if not, why.
function decreeBlock(id){
  if(!isRun()||!(G.phase==='draw'||G.phase==='discard'))return 'Only during a round.';
  const mine=G.turn===0,draw=mine&&G.phase==='draw',r=G.run;
  if(id==='pickpocket'){if(!draw)return 'Use it on your turn, before you draw.';if(!canTakePile(0))return 'The discard pile is off limits.';if(G.discard.length<2)return 'Needs two cards in the discard pile.';}
  if(id==='scout'){if(!draw)return 'Use it on your turn, before you draw.';if(r.peek||runHas('spyglass'))return 'You can already see the top card.';}
  if(id==='redeal'&&!draw)return 'Use it on your turn, before you draw.';
  if(id==='fog'&&!mine)return 'Use it on your turn.';
  if(id==='fog'&&r.fog!=null)return 'Fog is already down.';
  if(id==='pardon'&&r.pardon)return 'Already pardoned this round.';
  if(id==='insurance'&&r.insurance)return 'Already insured this round.';
  if(G.outBy===0)return 'You’re already out.';
  return '';
}
function useDecree(id){
  const r=G.run,me=G.players[0];
  if(!r.decrees.includes(id)||decreeBlock(id))return;
  r.decrees.splice(r.decrees.indexOf(id),1);
  if(id==='pickpocket'){const c=G.discard.splice(G.discard.length-2,1)[0];me.hand.push(c);G.fresh=c.id;sel=null;G.phase='discard';G.log=`Pickpocket: you took ${short(c)} from under the top card.`;}
  else if(id==='scout'){r.peek=true;G.log='Scout: the top card of the deck is face up.';}
  else if(id==='redeal'){const n=me.hand.length;G.deck.push(...me.hand);shuffle(G.deck);me.hand=G.deck.splice(G.deck.length-n,n);sel=null;G.log=`Redeal: you drew ${n} fresh cards.`;}
  else if(id==='fog'){r.fog=1;G.log=`Fog: ${G.players[1].name} can’t take from the discard pile next turn.`;}
  else if(id==='pardon'){r.pardon=true;G.log='Royal Pardon: your highest-scoring leftover card is free this round.';}
  else if(id==='insurance'){r.insurance=true;G.log='Insurance: this round’s bill is halved.';}
  runPanel=false;
}

// First-run walkthrough: three short cards the first time a Run starts (and from How to play).
const TOUR_KEY='kingsrun-tour';
let tour=null;
const tourSeen=()=>{try{return !!localStorage.getItem(TOUR_KEY)}catch(e){return true}};
const TOUR=()=>[
  {h:'Gold is your life',p:`You start with ${ECON.start} gold. Every point left in your hand when a round ends costs 1 gold. If the Treasury can’t cover it, the run is over.`,
    b:[`Go out first: +${ECON.out} gold`,`Lowest score at the table: +${ECON.low}`,`Royal tribute every round: +${ECON.tribute}`,`In rounds 1–3 a round never costs more than ${ECON.act1Cap}`]},
  {h:'Spend it at the Court',p:'After each round you visit the Court. Spending makes you stronger but leaves less gold in reserve, so choose carefully.',
    b:['Regalia last the whole run, up to '+ECON.maxR,'Decrees are used once, up to '+ECON.maxD+'. Tap the gold bar on the table to play one','New offers cost gold; you can sell a Regalia for half']},
  {h:'Beat the bosses',p:'Three rounds bring a boss to the table, and each one bends a rule.',
    b:['Round 4, The Miser: no taking from the discard pile','Round 8, The Jester: the wild card changes every turn','Round 11, The Usurper: your Jokers aren’t wild',`Score fewer points than the boss: +${ECON.boss} gold and a free pick at the next Court`]}];
function tourHTML(){
  const T=TOUR(),t=T[tour],last=tour===T.length-1;
  return `<div class="tour"><p class="eyebrow">The Run · ${tour+1} of ${T.length}</p><h2>${t.h}</h2><p>${t.p}</p>
    <ul class="rules">${t.b.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="sheetfoot"><button class="btn ghost" data-act="tourskip">${last?'Close':'Skip'}</button><button class="btn" data-act="tournext">${last?'Start playing':'Next'}</button></div>`;
}
function closeTour(){tour=null;try{localStorage.setItem(TOUR_KEY,'1')}catch(e){}}

const RUNREC_KEY='kingsrun-runs';
function loadRuns(){try{const r=JSON.parse(localStorage.getItem(RUNREC_KEY));if(r&&r.recent)return r}catch(e){}return{played:0,won:0,best:null,furthest:0,recent:[]}}
function recordRun(){
  if(G.recorded)return;G.recorded=true;
  const x=loadRuns(),r=G.run,won=r.over==='won';
  x.played++;if(won){x.won++;if(x.best===null||r.gold>x.best)x.best=r.gold;}
  x.furthest=Math.max(x.furthest,won?11:G.round);
  x.recent.unshift({date:Date.now(),won,round:G.round,gold:r.gold,regalia:r.regalia.map(id=>REG(id).name)});
  x.recent=x.recent.slice(0,10);
  try{localStorage.setItem(RUNREC_KEY,JSON.stringify(x))}catch(e){}
}
function runRecordsHTML(){
  const x=loadRuns();
  if(!x.played)return '<p class="note">No runs yet. Start one from the Menu.</p>';
  const tile=(l,v,w)=>`<div class="mark"><span class="ml">${l}</span><b>${v}</b>${w?`<span class="mw">${w}</span>`:''}</div>`;

function renderRunbar(){

function ledgerHTML(){

function runPanelHTML(){

    <h3>Decrees · ${r.decrees.length} of ${ECON.maxD}</h3>${decreeList(true)}
    ${r.pardon||r.insurance?`<p class="note">Active this round: ${[r.pardon&&'Royal Pardon',r.insurance&&'Insurance'].filter(Boolean).join(', ')}.</p>`:''}

function courtHTML(){
  const r=G.run,nr=G.round+1,nb=BOSSES[nr];
  const offer=(o,k)=>{const x=o.kind==='R'?REG(o.id):DEC(o.id),p=offerPrice(o);
    const full=o.kind==='R'?r.regalia.length>=ECON.maxR:r.decrees.length>=ECON.maxD;
    const lbl=o.sold?'Bought':full?(o.kind==='R'?'Regalia full':'Decrees full'):p>r.gold?`${p} gold`:p?`Buy · ${p}`:'Take free';
    return `<div class="offer${o.sold?' sold':''}"><span class="kind">${o.kind==='R'?'Regalia':'Decree'}</span><b>${esc(x.name)}</b><span class="tx">${esc(x.text)}</span>
      <button class="btn${o.sold||full||p>r.gold?' ghost':''}" data-act="rbuy" data-k="${k}" ${o.sold||full||p>r.gold?'disabled':''}>${lbl}</button></div>`;};
  return `<div class="sheethead"><h2>The Court</h2><span class="goldbig"><i class="coin" aria-hidden="true"></i>${r.gold}</span></div>
    <p class="note">Next: round ${nr} of 11 · ${nr+2} cards · ${rankLabel(nr+2)}s wild${nr<=3?` · bills capped at ${ECON.act1Cap}`:''}</p>
    ${nb?`<div class="bossnote">${bossArt(nb.key)}<b>Boss next: ${nb.name}</b><span>${nb.rule} Beat it for +${ECON.boss} gold and a free pick at the next Court.</span></div>`:''}
    ${r.free?'<p class="note good">Boss bounty: your first pick here is free.</p>':''}
    ${nr<=3&&r.gold<ECON.act1Cap?`<p class="note err">Careful: next round can cost up to ${ECON.act1Cap}, and you have ${r.gold}.</p>`:''}
    <div class="offers">${r.shop.map(offer).join('')}</div>

    <h3>Your Decrees · ${r.decrees.length} of ${ECON.maxD}</h3>${decreeList(false)}
    <div class="sheetfoot"><button class="btn ghost" data-act="menu">Menu</button><button class="btn" data-act="next">Deal round ${nr} · ${rankLabel(nr+2)}s wild</button></div>`;
}

// Computer players. In a Run, `skill` (0–1) is how often they make the best play; otherwise they always do.
const sloppy=p=>p.skill!=null&&randFloat()>p.skill;
function aiDraw(){
  const p=cur(),wr=rulesFor(G.turn),top=G.discard[G.discard.length-1];
  let take=false;
  if(top&&canTakePile(G.turn)){
    if(isWild(top,wr))take=true;
    else{const now=solve(p.hand,wr).cost;const d=bestDiscard([...p.hand,top],wr);if(d.card!==top&&d.cost<now)take=true;
      if(sloppy(p))take=randFloat()<.5;}
  }
  const c=take?G.discard.pop():drawDeck();
  p.hand.push(c);
  G.log=take?`${p.name} took ${short(c)} from the discard.`:`${p.name} drew from the deck.`;
  G.phase='discard';
}
function aiDiscard(){
  const p=cur(),wr=rulesFor(G.turn),d=bestDiscard(p.hand,wr);
  if(d.cost!==0&&sloppy(p)){const nw=p.hand.filter(c=>!isWild(c,wr));if(nw.length)d.card=nw[randInt(nw.length)];}
  p.hand=p.hand.filter(x=>x!==d.card);G.discard.push(d.card);
  G.log=G.log.replace(/\.$/,'')+`, discarded ${short(d.card)}`;
  endTurn();
  if(!/out!$/.test(G.log))G.log+='.';
}
function pump(){
  if(timer||!G||onl()||tour!=null)return;
  if(!cur().ai||!(G.phase==='draw'||G.phase==='discard'))return;
  timer=setTimeout(()=>{timer=null;if(tour!=null)return;if(G.phase==='draw')aiDraw();else aiDiscard();commit();},G.phase==='draw'?800:700);
}
function commit(){save();render();pump();}

// One group of cards in a single row. Every card but the last gets a column that can shrink to 42% of a card,
// so a long group overlaps like a fan rather than wrapping onto a second line.
function grpHTML(kind,label,cards,btn){
  const n=cards.length;
  const cols=n>1?`repeat(${n-1},minmax(calc(var(--cw)*.5),calc(var(--cw) + 4px))) var(--cw)`:'var(--cw)';
  const nb=kind==='spare'?Math.max(n,2.4):n;
  return `<div class="grp ${kind}" style="--n:${n};--nb:${nb}"><span class="gl">${label}</span><div class="cs" style="grid-template-columns:${cols}">${cards.map(btn).join('')}</div></div>`;
}
// Pick the largest card size at which the whole hand fits on screen without scrolling.
// Preference order: the biggest cards that fit fully spread out, then rows packed with slight overlap, then smaller cards.
// Small early-round hands get big cards; they shrink as the hand grows, so the hand always fills its space.
const FIT_STEPS=[...[150,138,128,116,106,98,90,83,77,71,66,62,58,54,50,48].map(cw=>[cw,false]),...[60,56,52,48,45,42,39,36,33].map(cw=>[cw,true])];
function fitHand(){
  const z=$('handzone'),g=$('groups');if(!z||!g)return;
  let chosen=FIT_STEPS[FIT_STEPS.length-1];
  for(const step of FIT_STEPS){
    const [cw,packed]=step;
    g.style.setProperty('--cw',cw+'px');g.classList.toggle('packed',packed);
    const rows=[...g.querySelectorAll('.cs')];
    const tooWide=rows.some(cs=>cs.scrollWidth>cs.clientWidth+1);
    // Spread mode must not overlap at all; overlap is only allowed once we fall back to packed rows.
    const squeezed=!packed&&rows.some(cs=>{const n=cs.children.length;return cs.clientWidth+1<n*cw+(n-1)*4;});
    if(!tooWide&&!squeezed&&z.scrollHeight<=z.clientHeight+1){chosen=step;break;}
  }
  g.style.setProperty('--cw',chosen[0]+'px');g.classList.toggle('packed',chosen[1]);
}

  document.querySelector('.app').classList.toggle('roomy',me.hand.length<=6);
  $('handTitle').textContent=(me.name==='You'||onl())?'Your hand':`${me.name}'s hand`;
  const s=solve(me.hand,wr);
  $('handMeta').textContent=run?`${Math.floor(s.cost)} pts unmatched`:`${s.cost} pts unmatched · Score ${me.score}`;
  renderRunbar();
  const canSel=myTurn&&G.phase==='discard';
  const btn=c=>cardHTML(c,wr,'button',`data-act="sel" data-id="${c.id}" ${canSel?'':'tabindex="-1"'}`,(sel===c.id?'sel ':'')+(G.fresh===c.id?'fresh':''));
  // If a discard lets this player go out, show the hand as it will be laid down, with the spare card set apart.
  let spare=null,lay=s;
  if(canSel){
    const b=bestDiscard(me.hand,wr);
    const rest=solve(me.hand.filter(c=>c!==b.card),wr);
    if(rest.cost===0){
      spare=b.card;lay=rest;
      const key=`${G.round}:${G.turn}:${G.fresh}`;
      if(autoKey!==key){autoKey=key;sel=spare.id;}
    }
  }
  let html=lay.melds.map(m=>grpHTML('meld',meldLabel(m,wr),m.cards,btn)).join('');
  if(spare)html+=grpHTML('spare','Discard',[spare],btn);
  else if(s.dead.length){
    // A long unmatched set is split into one row per suit, so nothing has to squeeze or wrap.
    if(s.dead.length<=6)html+=grpHTML('dead',`Unmatched · ${Math.floor(s.cost)}`,s.dead,btn);
    else{
      const bySuit=new Map();
      for(const c of s.dead){const k=isWild(c,wr)?'w':c.s;if(!bySuit.has(k))bySuit.set(k,[]);bySuit.get(k).push(c);}
      for(const [k,cs] of bySuit)html+=grpHTML('dead',k==='w'?'Unmatched · wild':`Unmatched ${SUITS[k]}`,cs,btn);
    }
  }
  $('groups').innerHTML=html;
  fitHand();
  $('pile3d').classList.toggle('flat',!top);
  motionFx(v);

  const d=$('discardBtn');
  const selCard=me.hand.find(c=>c.id===sel);
  if(!canSel){d.disabled=true;d.textContent=myTurn?'Draw a card first':'Waiting…';}
  else if(!selCard){d.disabled=true;d.textContent='Tap a card to discard';}
  else{
    d.disabled=false;
    const out=solve(me.hand.filter(c=>c!==selCard),wr).cost===0;
    d.textContent=G.outBy!==null?`Discard ${short(selCard)} & finish`:out?`Discard ${short(selCard)} & go out`:`Discard ${short(selCard)}`;
  }
  $('hintBtn').disabled=!canSel;
  {const A=document.querySelector('.actions'),ph=!myTurn?'wait':G.phase==='draw'?'draw':!selCard?'pick':'go';A.dataset.ph=ph;
   $('drawBtn').disabled=$('deckBtn').disabled;$('takeBtn').disabled=$('pileBtn').disabled;
   $('takeBtn').textContent=top?`Take ${short(top)}`:'Take discard';
   if(ph==='pick')d.textContent='Select a card to discard';}

  const showCover=pp()&&!G.reveal&&!menuOpen&&(G.phase==='draw'||G.phase==='discard');
  $('cover').hidden=!showCover;
  if(showCover){
    const p=cur();
    $('coverBody').innerHTML=`<div class="fan3"><span class="card back"></span><span class="card back"></span><span class="card back"></span></div>
      <p class="eyebrow">Round ${G.round} of 11 · ${rankLabel(wn)}s wild</p>
      <h2>Pass to ${p.name}</h2>
      ${G.log?`<p class="clog">${G.log}</p>`:''}
      <p class="cscores">${G.players.map(q=>`${q.name} ${q.score}`).join(' · ')}</p>
      <button class="btn" data-act="reveal">Show ${p.name}'s hand</button>
      <button class="iconbtn" data-act="menu">Menu</button>`;
  }

  renderSheet();
}

// A finished hand on the results screen. Like the hand on the table, each group stays on one row and overlaps if it must.
function layHTML(r,wr){
  const g=(cls,cards)=>{const n=cards.length;
    const cols=n>1?`repeat(${n-1},minmax(calc(var(--cw)*.5),calc(var(--cw) + 2px))) var(--cw)`:'var(--cw)';
    return `<div class="g${cls}" style="grid-template-columns:${cols}">${cards.map(c=>cardHTML(c,wr)).join('')}</div>`;};
  return `<div class="lay">${r.melds.map(m=>g('',m.cards)).join('')}${r.dead.length?g(' dead',r.dead):''}</div>`;
}
function scoreTable(){
  const rows=G.players[0].rounds.map((_,i)=>`<tr><td>Round ${i+1}</td>${G.players.map(p=>`<td>${p.rounds[i]}</td>`).join('')}</tr>`).join('');
  return `<div class="scroll"><table class="sc"><thead><tr><th></th>${G.players.map(p=>`<th>${p.name}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${N()+1}">No rounds finished yet</td></tr>`}</tbody><tfoot><tr><td>Total</td>${G.players.map(p=>`<td>${p.score}</td>`).join('')}</tr></tfoot></table></div>`;
}
// Largest card size at which every player's hand (and, between rounds, the Deal button) fits on screen.
const RES_SIZES=[96,86,78,70,63,57,52,47,43,39,36,33,30];
function fitResults(){
  const sh=$('sheet');if(!sh.classList.contains('results'))return;
  // The Deal / Play again buttons are pinned to the bottom, so fit every hand into the space above them.
  let chosen=RES_SIZES[RES_SIZES.length-1];
  for(const cw of RES_SIZES){
    sh.style.setProperty('--rcw',cw+'px');
    const t=[...sh.querySelectorAll('.res')].pop(),foot=sh.querySelector('.sheetfoot');
    const sr=sh.getBoundingClientRect(),tr=t.getBoundingClientRect();
    const room=sh.clientHeight-(foot?foot.offsetHeight:0);
    const squeezed=[...sh.querySelectorAll('.res .g')].some(g=>g.scrollWidth>g.clientWidth+1);
    if(!squeezed&&tr.bottom-sr.top+sh.scrollTop<=room+1){chosen=cw;break;}
  }
  sh.style.setProperty('--rcw',chosen+'px');
  sh.classList.toggle('tiny',chosen<44);
}
addEventListener('resize',()=>{if(G)fitResults();});

const ONLINE=true;
const API='https://rghnwpogdjcrqpscgiuh.supabase.co';

async function api(action,extra={}){
  const body={action,...extra};
  if(O&&!body.code){body.code=O.code;body.token=O.token;}
  let r;
  try{r=await fetch(API+'/functions/v1/kingsrun',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});}
  catch(e){const err=new Error('Can’t reach the game server. Check your internet connection.');err.network=true;throw err;}
  let j=null;try{j=await r.json()}catch(e){}
  if(!j||!j.ok){const err=new Error((j&&j.error)||'The game server didn’t answer properly. Try again.');err.status=r.status;throw err;}
  return j;
}

function wasRecorded(k){try{return (JSON.parse(localStorage.getItem(ON_REC))||[]).includes(k)}catch(e){return false}}
function markRecorded(k){try{const a=JSON.parse(localStorage.getItem(ON_REC))||[];a.push(k);localStorage.setItem(ON_REC,JSON.stringify(a.slice(-50)))}catch(e){}}

// Turn the server's view into the same shape the local game uses, so the board renders it unchanged.
function applyOnline(j){
  const P=j.public;
  O.version=j.version;O.seat=j.seat;O.err='';O.offline=false;
  const keepSel=sel!=null&&j.hand.some(c=>c.id===sel);
  G={mode:'online',me:j.seat,cfg:{mode:'online',count:P.players.length,names:[]},reveal:true,
     players:P.players.map((p,i)=>({name:p.name,ai:p.ai,score:p.score,rounds:p.rounds,hand:i===j.seat?j.hand:Array.from({length:p.count},()=>({}))})),
     round:P.round,deck:{length:P.deckCount},discard:P.top?[P.top]:[],turn:P.turn,phase:P.phase,outBy:P.outBy,finalLeft:P.finalLeft,
     log:P.log,fresh:j.fresh,result:P.result,gameId:P.gameId};
  if(!keepSel)sel=null;
  const rk=O.code+':'+P.gameId;
  G.recorded=wasRecorded(rk);
  if(G.phase==='gameEnd'&&!G.recorded){recordGame();markRecorded(rk);}
}

      ${i===G.me?'<span class="tagp">You</span>':''}${i===0?'<span class="tagp">Host</span>':''}${p.ai?'<span class="cpu">CPU</span>':''}
      ${host&&i>0?`<button class="mini-btn" data-act="oremove" data-seat="${i}">Remove</button>`:''}</li>`).join('')}</ul>

function onlineMenuHTML(){

function openMenu(){
  menuOpen=true;menuView='main';confirmReset=false;confirmClear=false;restoreOpen=false;backupCode=null;recMsg='';inviteMsg='';
  const saved=loadNames();
  const m=G.cfg.mode==='online'?'ai':G.cfg.mode;
  pending={mode:m,level:LEVELS[G.cfg.level]?G.cfg.level:levelPref(),count:G.cfg.mode==='online'?2:G.cfg.count,names:Array.from({length:4},(_,i)=>(G.cfg.names||[])[i]||saved[i]||'')};

}
function copyInvite(){
  const url=inviteURL();
  const ok=()=>{inviteMsg='Invite link copied. Paste it into a message to your friends.';render();};
  const fail=()=>{inviteMsg=`Copy this link: ${esc(url)}`;render();};
